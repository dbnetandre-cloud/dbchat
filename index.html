<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content">
  <title>DBCHAT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0066ff">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DbChat">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    /* Personalização do webchat (o prefixo "body" garante prioridade sobre o opa.css) */
    :root {
      --chat-cor: #0066ff;      /* cor principal */
      --chat-fundo: #f5f7fa;    /* fundo da conversa */
    }

    /* Botão flutuante */
    body .opa_ico {
      background: var(--chat-cor);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      bottom: 20px;
      right: 20px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    }

    /* Janela do chat (base) */
    body .opa_chat {
      background: var(--chat-fundo);
      overflow: hidden;
      font-family: system-ui, "Segoe UI", sans-serif;
    }

    /* O chat fica sempre aberto: esconde o botão flutuante e os botões de minimizar/fechar */
    body .opa_ico,
    body .opa_minimize,
    body .opa_close,
    body .sem-login,
    body .div-logins { display: none !important; }
    body .opa_cabecalho { padding-right: 12px; }

    /* ===== DESKTOP: coluna de destaque à esquerda + chat à direita ===== */
    /* Coluna dos anúncios (dois quadrados 1:1, um em cima do outro). O chat ocupa o resto da tela. */
    :root { --coluna-largura: clamp(240px, min(36vw, calc(50vh - 62px)), 560px); }

    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #eef2f7; }

    body .opa_chat {
      top: 20px;
      bottom: 20px;
      left: calc(var(--coluna-largura) + 40px);
      right: 20px;
      width: auto;
      height: auto;
      max-height: none;
      border-radius: 12px;
    }

    .destaque {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: fixed;
      top: 20px;
      bottom: 20px;
      left: 20px;
      width: var(--coluna-largura);
      justify-content: center;
    }
    .planos {
      flex: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .anuncio {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 40, 120, .25);
    }
    .plano {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #dde4ee;
    }
    /* Troque o .img por <img src="plano1.jpg"> quando tiver as imagens */
    .plano .img {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--chat-cor), #7ab800);
    }
    .plano .info { padding: 14px 16px; }
    .plano .info strong { display: block; font-size: 18px; color: #1a2b4a; }
    .plano .info span { color: #5b6b85; font-size: 14px; }
    .contato {
      flex: none;
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      gap: 6px 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .1);
    }
    .contato div small { display: block; font-size: 11px; color: #5b6b85; }
    .contato div strong { font-size: 15px; color: #1a2b4a; }
    .contato a { color: inherit; text-decoration: none; }
    .contato a:hover { color: var(--chat-cor); text-decoration: underline; }


    /* ===== Menu hambúrguer (só no celular): abre a propaganda ===== */
    .opa_menu_btn { display: none; }
    .destaque-fechar { display: none; }
    /* ===== CELULAR: chat em tela cheia, sem coluna de destaque ===== */
    @media (max-width: 768px) {
      .destaque { display: none; }

      /* celular: o principal ocupa a linha toda; os secundários dividem a linha de baixo em duas metades iguais */
      html body .opa_atalhos button.principal { flex: 1 1 100%; }
      html body .opa_atalhos button:not(.principal) {
        flex: 1 1 calc(50% - 4px);
        min-width: 0;
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.25;
        border-radius: 18px;
      }

      /* celular: o desenho ocupa a largura toda, uma vez só */
      html body .opa_corpo { background-size: 100% auto; }

      .opa_menu_btn {
        order: -1;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        margin-left: -4px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
      }
      .opa_menu_btn:active { background: rgba(255, 255, 255, .2); }
      .opa_menu_btn svg { width: 24px; height: 24px; }
      body .opa_chat .opa_menu_btn svg path { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }

      /* Menu aberto: a propaganda ocupa a tela, com telefone e site no rodapé */
      body.menu-aberto .destaque {
        display: flex;
        position: fixed;
        inset: 0;
        width: auto;
        z-index: 100000;
        box-sizing: border-box;
        padding: 56px 16px 16px;
        background: rgba(8, 16, 32, .55);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);   /* borra a conversa que fica atrás */
        animation: wc_subir .2s ease-out;
      }
      /* no menu do celular a arte se ajusta à altura que sobra, e o telefone/site ficam sempre visíveis */
      body.menu-aberto .planos {
        flex: 1 1 auto;
        min-height: 0;
        justify-content: center;
        align-items: center;
      }
      /* O espaço dos anúncios é medido na própria área (cqw/cqh), então não depende da barra do navegador do celular.
         A linha de baixo é só um plano B para navegadores sem essa medida. */
      body.menu-aberto .planos { container-type: size; }
      body.menu-aberto .anuncio {
        width: min(100%, calc(50dvh - 78px));
        width: min(100cqw, calc(50cqh - 6px));
        box-shadow: none;
      }
      body.menu-aberto .anuncio { cursor: zoom-in; }
      /* anúncio ampliado: sozinho, no centro da tela, de ponta a ponta na largura */
      body.menu-ampliado .anuncio:not(.ampliado) { display: none; }
      body.menu-ampliado .anuncio.ampliado {
        width: min(100vw, 100cqh);
        max-width: none;
        border-radius: 0;
        cursor: zoom-out;
        animation: wc_subir .2s ease-out;
      }
      body.menu-aberto .contato { justify-content: space-between; }
      body.menu-aberto .destaque-fechar {
        position: absolute;
        top: 10px;
        right: 12px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, .18);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
      }
      /* iPhone: campos com fonte menor que 16px fazem o Safari dar zoom ao digitar e bagunçam a altura */
      body .opa_rodape_input { font-size: 16px !important; }
      /* Teclado aberto: trava a página para ela não "sair do lugar" ao arrastar (só enquanto digita,
         assim puxar para atualizar continua funcionando no resto do tempo) */
      html.teclado, html.teclado body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body .opa_chat {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Cabeçalho */
    body .opa_cabecalho {
      background: var(--chat-cor);
      height: 60px;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
    }

    /* Foto à esquerda (estilo WhatsApp) */
    body .opa_cabecalho::before {
      content: "";
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff url("logo.png") center / 70% no-repeat;
    }

    /* Nome ao lado da foto, com o status embaixo */
    .opa_titulo {
      order: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      line-height: 1.2;
    }
    .opa_titulo .nome {
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .5px;
    }
    /* cabeçalho estreito (celular ou chat pequeno): não cabe "Atendimento", fica só o nome */
    body .opa_cabecalho { container-type: inline-size; }
    @container (max-width: 520px) { .opa_titulo .prefixo { display: none; } }
    .opa_status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      white-space: nowrap;
      color: rgba(255, 255, 255, .88);
    }
    .opa_status::before {
      content: "";
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3ddc84;
      box-shadow: 0 0 0 2px rgba(61, 220, 132, .35);
    }
    .opa_status.conectando::before { background: #ffb300; box-shadow: 0 0 0 2px rgba(255, 179, 0, .35); animation: wc_piscar 1s infinite; }
    .opa_status.offline::before    { background: #ff5252; box-shadow: 0 0 0 2px rgba(255, 82, 82, .35); }
    .opa_status.encerrado::before  { background: #b0bec5; box-shadow: 0 0 0 2px rgba(176, 190, 197, .35); }
    @keyframes wc_piscar { 50% { opacity: .35; } }

    body .opa_close,
    body .opa_minimize {
      height: 60px;
      background-position: center;
    }

    /* "Continuar sem efetuar login" como botão */
    body .sem-login {
      display: block;
      box-sizing: border-box;
      width: 250px;
      margin: 12px auto 0;
      padding: 0 16px;
      line-height: 40px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--chat-cor);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: filter .15s, transform .05s;
    }
    body .sem-login:hover  { filter: brightness(1.1); }
    body .sem-login:active { transform: scale(.98); }

    /* ===== Barra inferior ===== */
    body .opa_rodape {
      height: auto;
      min-height: 64px;
      padding: 10px 12px;
      gap: 8px;
      align-items: center;
      background: #fff;
      border-top: 1px solid #e3e8ef;
    }
    body .opa_rodape_menu,
    body .opa_rodape_send,
    body .opa_emoji_btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color .15s, transform .05s;
    }
    body .opa_rodape_menu {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%236b7a90' d='M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z'/></svg>");
      background-size: 22px;
    }
    body .opa_rodape_menu:hover,
    body .opa_emoji_btn:hover { background-color: #eef2f7; opacity: 1; }
    body .opa_emoji_btn {
      border: 0;
      background: transparent;
      font-size: 22px;
      line-height: 40px;
      padding: 0;
    }
    /* campo do tipo "busca": tira o "x" e o estilo próprio do navegador */
    body .opa_rodape_input::-webkit-search-cancel-button,
    body .opa_rodape_input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    body .opa_rodape_input {
      -webkit-appearance: none;
      appearance: none;
      height: 40px !important;
      padding: 0 16px !important;
      border-radius: 20px !important;
      background: #f0f2f5 !important;
      font-size: 15px !important;
      min-width: 0;
    }
    body .opa_rodape_send {
      background-color: var(--chat-cor);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='white' d='M2 21l21-9L2 3v7l15 2-15 2z'/></svg>");
      background-size: 20px;
    }
    body .opa_rodape_send:hover { opacity: 1; filter: brightness(1.12); }
    body .opa_rodape_send:active { transform: scale(.94); }

    /* Mensagens prontas (só antes de começar a conversa) */
    .opa_atalhos {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px 4px;
      background: var(--chat-fundo);
    }
    .opa_atalhos button {
      border: 1px solid var(--chat-cor);
      background: #fff;
      color: var(--chat-cor);
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background-color .15s, color .15s;
    }
    .opa_atalhos button:hover { background: var(--chat-cor); color: #fff; }
    /* hierarquia: o principal ocupa a linha toda e é preenchido; os outros são menores e só com contorno */
    .opa_atalhos button:not(.principal) { font-size: 12.5px; padding: 6px 10px; }
    .opa_atalhos button.principal {
      flex: 1 1 100%;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 600;
      background: var(--chat-cor);
      color: #fff;
    }
    .opa_atalhos button.principal:hover { filter: brightness(1.1); }


    /* Atendimento encerrado: campo desativado + botão de novo atendimento */
    body .opa_rodape.encerrado > :not(.opa_novo) { display: none !important; }
    .opa_novo {
      flex: 1;
      height: 44px;
      border: 0;
      border-radius: 22px;
      background: var(--chat-cor);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .opa_novo:hover { filter: brightness(1.1); }
    .opa_aviso_fim {
      flex: none;
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
      color: #5b6b85;
      background: var(--chat-fundo);
    }


    /* ===== Mensagens: avatar + nome fora do balão ===== */
    body .opa_msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 6px 12px;
    }
    body .opa_msg.enviada { flex-direction: row-reverse; }
    .opa_msg_col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: calc(100% - 52px);
    }
    .opa_msg.enviada .opa_msg_col { align-items: flex-end; }
    .opa_nome {
      margin: 0 6px 3px;
      font-size: 12px;
      font-weight: 600;
      color: #5b6b85;
    }
    .opa_avatar {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
    }
    .opa_avatar.atendente { background: #fff url("logo.png") center / 70% no-repeat; }
    .opa_avatar.cliente {
      background: #c5d0de url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><circle cx='18' cy='14' r='6' fill='white'/><path d='M6 33c0-7 5-11 12-11s12 4 12 11z' fill='white'/></svg>") center / cover no-repeat;
    }
    /* balões sem a "setinha" antiga, com visual mais limpo */
    body .opa_ballon { margin: 0; border-radius: 14px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
    body .opa_ballon::before,
    body .opa_ballon::after { display: none !important; }
    body .opa_ballon.recebida { background: #fff; border-bottom-left-radius: 4px; }
    body .opa_ballon.enviada  { background: #dcebff; border-bottom-right-radius: 4px; }


    /* ===== Áudio ===== */
    .opa_mic_btn, .opa_rec_cancel, .opa_rec_enviar {
      flex: none;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color .15s;
    }
    .opa_mic_btn, .opa_rec_cancel { background: transparent; }
    .opa_mic_btn:hover, .opa_rec_cancel:hover { background: #eef2f7; }
    .opa_mic_btn svg { width: 22px; height: 22px; }
    /* o opa.css pinta todo path de branco, então precisa sobrescrever no path */
    body .opa_chat .opa_mic_btn svg path { fill: #6b7a90; }
    body .opa_chat .opa_rec_enviar svg path { fill: #fff; }
    .opa_rec_cancel { color: #d93025; font-size: 18px; }
    .opa_rec_enviar { background: var(--chat-cor); }
    .opa_rec_enviar:hover { filter: brightness(1.12); }
    .opa_rec_enviar svg { width: 20px; height: 20px; fill: #fff; }
    .opa_rec {
      display: none;
      flex: 1;
      align-items: center;
      gap: 10px;
    }
    .opa_rec_dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d93025;
      animation: opa_piscar 1s infinite;
    }
    .opa_rec_tempo { flex: 1; font-size: 16px; color: #1a2b4a; font-variant-numeric: tabular-nums; }
    @keyframes opa_piscar { 50% { opacity: .25; } }
    /* Gravando: esconde o resto da barra e mostra só o gravador */
    body .opa_rodape.gravando > :not(.opa_rec) { display: none !important; }
    body .opa_rodape.gravando > .opa_rec { display: flex; }


    /* ===== Tamanho da fonte da conversa (A- / A+) ===== */
    body .opa_chat { --zoom-fonte: 1; }
    body .opa_ballon { font-size: calc(14px * var(--zoom-fonte)); line-height: 1.45; }
    body .opa_ballon .time { font-size: calc(10px * var(--zoom-fonte)); line-height: 1.2; }
    .opa_nome { font-size: calc(12px * var(--zoom-fonte)); }
    .opa_fonte {
      order: 3;            /* depois do nome DBNET */
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .opa_fonte button {
      box-sizing: border-box;
      width: 38px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 16px;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .5px;
      cursor: pointer;
    }
    .opa_fonte button:hover:not(:disabled) { background: rgba(255, 255, 255, .28); }
    .opa_fonte button:disabled { opacity: .4; cursor: default; }


    /* ===== Botão de tema (claro/escuro) ===== */
    .opa_tema {
      order: 4;
      flex: none;
      box-sizing: border-box;
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
      cursor: pointer;
      margin-left: -4px;
    }
    .opa_tema:hover { background: rgba(255, 255, 255, .28); }
    .opa_tema svg { width: 18px; height: 18px; }
    body .opa_chat .opa_tema svg path { fill: #fff; }
    .opa_tema .sol { display: none; }
    body.escuro .opa_tema .sol { display: block; }
    body.escuro .opa_tema .lua { display: none; }

    /* ===== Modo escuro ===== */
    body.escuro { --chat-fundo: #0f1722; background: #0b1220; color: #e6edf7; }
    body.escuro .contato div strong { color: #e6edf7; }
    body.escuro .contato { background: #172033; box-shadow: none; }
    body.escuro .contato div small { color: #9fb0c8; }
    body.escuro .anuncio { box-shadow: 0 6px 24px rgba(0, 0, 0, .6); }

    body.escuro .opa_chat { box-shadow: 0 0 0 1px #2a3750, 0 6px 24px rgba(0, 0, 0, .6); }
    body.escuro .opa_rodape { background: #172033; border-top-color: #2a3750; }
    body.escuro .opa_rodape_input { background: #243049 !important; color: #e6edf7 !important; }
    body.escuro .opa_rodape_input::placeholder { color: #8394ae; }
    body.escuro .opa_rodape_menu:hover,
    body.escuro .opa_emoji_btn:hover,
    body.escuro .opa_mic_btn:hover,
    body.escuro .opa_rec_cancel:hover { background-color: #243049; }
    body.escuro .opa_chat .opa_mic_btn svg path { fill: #9fb0c8; }
    body.escuro .opa_rec_tempo { color: #e6edf7; }

    body.escuro .opa_nome { color: #9fb0c8; }
    body.escuro .opa_ballon { color: #e6edf7; box-shadow: none; }
    body.escuro .opa_ballon.recebida { background: #1f2a40; }
    body.escuro .opa_ballon.enviada { background: #1f4b8f; }
    body.escuro .opa_ballon .time { color: rgba(255, 255, 255, .55); }
    body.escuro .opa_avatar { box-shadow: none; }

        'font:10px/1.3 monospace;color:#7CFC00;background:rgba(0,0,0,.82);pointer-events:none;white-space:pre-wrap;';
      document.body.appendChild(box);

      var t0 = performance.now();
      var contagem = {};
      var recentes = [];
      var primeiroHistorico = null;
      var ligado = false;

      function curto(v) { return v ? v.slice(0, 8) + '…' : '—'; }
      function ck() { var m = document.cookie.match(/opa_user=([^;]+)/); return m ? m[1] : ''; }
      function ls() { try { return localStorage.getItem('webchat_opa_user') || ''; } catch (e) { return '?'; } }

      function desenhar() {
        var s = (typeof opa !== 'undefined') ? opa.socket : null;
        if (s && !ligado) {
          ligado = true;
          s.onAny(function(nome) {
            if (/trunk:status/.test(nome)) return;
            contagem[nome] = (contagem[nome] || 0) + 1;
            if (nome === 'Messages' && primeiroHistorico === null) primeiroHistorico = Math.round(performance.now() - t0);
            recentes.push(nome + '@' + Math.round(performance.now() - t0));
            if (recentes.length > 6) recentes.shift();
          });
        }
        var qs = (s && s.io && s.io.opts && s.io.opts.query) ? s.io.opts.query : '';
        var q = (typeof qs === 'string' ? (qs.match(/opa_user=([^&]*)/) || [])[1] : (qs && qs.opa_user)) || '';
        box.textContent =
          'cookie=' + curto(ck()) + '  salvo=' + curto(ls()) + '  enviado=' + curto(q) + '\n' +
          'socket=' + (s ? (s.connected ? 'conectado' : 'desconectado') : 'nulo') +
          '  balões=' + document.querySelectorAll('.opa_ballon').length +
          '  tempo=' + Math.round(performance.now() - t0) + 'ms\n' +
          'Messages 1ª vez=' + (primeiroHistorico === null ? '—' : primeiroHistorico + 'ms') +
          '  eventos: ' + JSON.stringify(contagem) + '\n' +
          'últimos: ' + recentes.join(', ');
      }
      setInterval(desenhar, 400);
      desenhar();
    })();
  </script>
</body>
</html>
